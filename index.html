<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Flashcards</title>
  <meta name="description" content="Learn Python one concept at a time — flashcard interaktif untuk pemula.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ===== HEADER ===== -->
    <header class="app-header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1><span class="accent">Python</span> Flashcards</h1>
          <p class="subtitle">Learn Python one concept at a time.<span class="caret" aria-hidden="true"></span></p>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-num stat-green" id="statMastered">0</span>
          <span class="stat-sub">dikuasai</span>
        </div>
        <div class="stat-sep" aria-hidden="true"></div>
        <div class="stat">
          <span class="stat-num" id="statTotal">–</span>
          <span class="stat-sub">total kartu</span>
        </div>
      </div>
    </header>

    <!-- ===== TOOLBAR: pencarian, filter, aksi ===== -->
    <section class="toolbar" aria-label="Filter dan alat belajar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Cari kartu… (mis. list, lambda, dict)"
               autocomplete="off" aria-label="Cari flashcard">
      </div>
      <select id="levelFilter" class="select" aria-label="Filter tingkat kesulitan">
        <option value="all">Semua Level</option>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
      </select>
      <select id="catFilter" class="select" aria-label="Filter kategori"></select>
      <div class="toolbar-actions">
        <button class="btn" id="shuffleBtn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg><span>Acak Kartu</span>
        </button>
        <button class="btn" id="resetBtn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg><span>Reset Progress</span>
        </button>
      </div>
    </section>

    <!-- ===== STAGE: kartu, progress, navigasi ===== -->
    <main class="stage">
      <div class="stage-meta">
        <span class="deck-info" id="deckInfo">– kartu</span>
        <span class="card-counter" id="cardCounter">CARD <b>–</b> / –</span>
      </div>

      <div class="card" id="card" role="button" tabindex="0" aria-label="Flashcard">
        <div class="card-inner">
          <div class="card-face card-front" id="cardFront"></div>
          <div class="card-face card-back" id="cardBack"></div>
        </div>
      </div>

      <div class="progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text">
          <span id="progressLabel">0 / 0 dikuasai</span>
          <span id="progressPct">0%</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="btnPrev" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg><span class="btn-label">Prev</span>
        </button>
        <button class="btn" id="btnFlip" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg><span class="btn-label">Balik Kartu</span>
        </button>
        <button class="btn" id="btnMastered" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg><span class="btn-label" id="masteredLabel">Tandai Dikuasai</span>
        </button>
        <button class="btn btn-primary" id="btnNext" type="button">
          <span class="btn-label">Next</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
    </main>

    <!-- ===== FOOTER: petunjuk keyboard ===== -->
    <footer class="kbd-hints">
      <span class="kbd-item"><kbd>Space</kbd> balik kartu</span>
      <span class="kbd-item"><kbd>←</kbd><kbd>→</kbd> navigasi</span>
      <span class="kbd-item"><kbd>M</kbd> tandai dikuasai</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
